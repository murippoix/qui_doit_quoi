<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f5"><title>Qui doit quoi ?</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f7f7f5}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:20px 16px 48px}
h1{font-size:27px;margin:8px 0 4px}.sub{color:#777;margin-bottom:20px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #00000008}
label{display:block;font-size:13px;color:#666;margin:0 0 6px}input,select,button{width:100%;font:inherit;border-radius:12px;border:1px solid #ddd;padding:12px;background:#fff}
button{border:0;background:#222;color:#fff;font-weight:600;cursor:pointer;margin-top:10px}.secondary{background:#eee!important;color:#222!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.people{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.person{background:#f1f1ef;padding:7px 10px;border-radius:999px;font-size:14px}
.rate{font-size:13px;color:#666;line-height:1.5}.expense{border-top:1px solid #eee;padding:13px 0}.expense:first-child{border-top:0}
.top{display:flex;justify-content:space-between;gap:10px}.top>div:last-child{text-align:right}.empty{color:#888;text-align:center;padding:12px}.notice{font-size:12px;color:#777;line-height:1.5}
.alloc{border:1px solid #eee;border-radius:12px;padding:10px;margin-top:10px}.alloc-row{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:end}.hint{font-size:12px;color:#777;margin-top:7px}
hr{border:0;border-top:1px solid #eee;margin:14px 0}@media(max-width:480px){.row{grid-template-columns:1fr}.alloc-row{grid-template-columns:1fr 110px}}
</style>
</head>
<body><div class="wrap">
<h1>Qui doit quoi ?</h1><div class="sub">旅の割り勘・立替精算</div>

<div class="card"><label>旅行名</label><input id="trip" placeholder="例：タイ旅行"></div>

<div class="card"><label>参加者の名前</label>
<div class="row"><input id="name" placeholder="名前を入力"><button id="addPerson">参加者を追加</button></div>
<div id="people" class="people"></div></div>

<div class="card"><label>為替レート</label><div class="rate" id="rate">レートを読み込んでいます…</div>
<button id="refresh" class="secondary">最新レートを更新</button></div>

<div class="card"><label>支払いを追加</label>
<div class="row">
<div><label>実際に支払った人</label><select id="payer"></select></div>
<div><label>通貨</label><select id="currency"><option value="THB">🇹🇭 THB（バーツ）</option><option value="VND">🇻🇳 VND（ドン）</option><option value="JPY">🇯🇵 JPY（円）</option></select></div>
</div>
<div style="margin-top:10px"><label>実際に支払った金額</label><input id="amount" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
<div style="margin-top:10px"><label>内容（任意）</label><input id="memo" placeholder="例：カフェ、ホテル、Grab"></div>

<div class="alloc"><label>この支払いを誰の負担にするか</label>
<div id="allocations"></div>
<div class="hint">商品ごとの負担額を入力できます。合計は「実際の支払額」からポイント・値引きを引いた負担額に合わせてください。</div>
</div>
<button id="addExpense">支払いを追加</button>
<div id="expenses" class="empty">まだ支払いがありません</div>
</div>

<div class="card"><h2 style="margin:0 0 8px;font-size:20px">精算</h2>
<div id="summary" class="result">参加者と支払いを入力すると表示されます。</div>
<div class="notice">※為替レートは取得時点のレートです。実際のカード・両替所のレートや手数料とは異なる場合があります。</div></div>
</div>
<script>
const API='https://open.er-api.com/v6/latest/JPY';
let state=JSON.parse(localStorage.getItem('tripSplit')||'null')||{trip:'',people:[],expenses:[],rates:null,updated:null};
const $=id=>document.getElementById(id); $('trip').value=state.trip;
function save(){localStorage.setItem('tripSplit',JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n,c){return new Intl.NumberFormat('ja-JP',{maximumFractionDigits:c==='JPY'?0:c==='VND'?0:2}).format(n)}
function toJPY(a,c){if(c==='JPY')return a;const r=state.rates?.[c];return r?a/r:0}
function renderPeople(){
 $('people').innerHTML=state.people.length?state.people.map(p=>`<span class="person">${esc(p)}</span>`).join(''):'';
 $('payer').innerHTML=state.people.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
 renderAllocations();renderExpenses();renderSummary();
}
function renderAllocations(){
 if(!state.people.length){$('allocations').innerHTML='<div class="empty">先に参加者を追加してください。</div>';return}
 $('allocations').innerHTML=state.people.map((p,i)=>`<div class="alloc-row" style="margin-top:${i?8:0}px"><label style="margin:0">${esc(p)}の負担額</label><input class="alloc-input" data-person="${esc(p)}" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>`).join('');
}
function renderExpenses(){
 $('expenses').className=state.expenses.length?'':'empty';
 $('expenses').innerHTML=state.expenses.length?state.expenses.map((e,i)=>{
  const alloc=e.allocations.map(a=>`${esc(a.person)} ¥${fmt(toJPY(a.amount,e.currency),'JPY')}`).join(' ／ ');
  return `<div class="expense"><div class="top"><div><b>${esc(e.payer)}</b> が支払い</div><div><b>${fmt(e.amount,e.currency)} ${e.currency}</b><br><small>負担：${alloc}</small><br><button class="secondary" style="width:auto;padding:5px 9px;margin-top:4px" onclick="delExpense(${i})">削除</button></div></div><small>${esc(e.memo||'')}</small></div>`;
 }).join(''):'まだ支払いがありません';
}
function renderSummary(){
 if(state.people.length<2||!state.expenses.length){$('summary').textContent='参加者と支払いを入力すると表示されます。';return}
 if(!state.rates){$('summary').textContent='レート取得後に表示されます。';return}
 const paid=Object.fromEntries(state.people.map(p=>[p,0])), burden=Object.fromEntries(state.people.map(p=>[p,0]));
 state.expenses.forEach(e=>{paid[e.payer]+=toJPY(e.amount,e.currency);e.allocations.forEach(a=>burden[a.person]+=toJPY(a.amount,e.currency))});
 const bal=state.people.map(p=>({p,amt:paid[p]-burden[p]})),debt=bal.filter(x=>x.amt<-.005).map(x=>({p:x.p,amt:-x.amt})),cred=bal.filter(x=>x.amt>.005).map(x=>({p:x.p,amt:x.amt}));
 const tx=[];let i=0,j=0;while(i<debt.length&&j<cred.length){const x=Math.min(debt[i].amt,cred[j].amt);tx.push(`${esc(debt[i].p)} → ${esc(cred[j].p)}：<b>¥${fmt(x,'JPY')}</b>`);debt[i].amt-=x;cred[j].amt-=x;if(debt[i].amt<.01)i++;if(cred[j].amt<.01)j++}
 const total=state.expenses.reduce((s,e)=>s+toJPY(e.amount,e.currency),0);
 $('summary').innerHTML=`実際の支払合計：<b>¥${fmt(total,'JPY')}</b><hr>${tx.length?tx.join('<br>'):'精算はありません。'}<hr><small>各人の「実際の支払額 − 負担額」で精算しています。</small>`;
}
async function loadRates(){
 $('rate').textContent='最新レートを読み込んでいます…';
 try{const d=await (await fetch(API,{cache:'no-store'})).json();if(d.result!=='success')throw Error();
 state.rates={THB:d.rates.THB,VND:d.rates.VND,JPY:1};state.updated=d.time_last_update_utc;save();
 $('rate').innerHTML=`1 JPY = <strong>${fmt(d.rates.THB,'THB')} THB</strong> ／ <strong>${fmt(d.rates.VND,'VND')} VND</strong><br>取得時刻：${esc(d.time_last_update_utc)}`;renderExpenses();renderSummary();
 }catch(e){$('rate').textContent='レートを取得できませんでした。インターネット接続をご確認ください。'}
}
$('addPerson').onclick=()=>{const n=$('name').value.trim();if(n&&!state.people.includes(n)){state.people.push(n);$('name').value='';save();renderPeople()}};
$('name').onkeydown=e=>{if(e.key==='Enter')$('addPerson').click()};
$('trip').oninput=e=>{state.trip=e.target.value;save()};
$('refresh').onclick=loadRates;
$('addExpense').onclick=()=>{
 const payer=$('payer').value,amount=Number($('amount').value),currency=$('currency').value;
 if(!payer||!Number.isFinite(amount)||amount<=0)return;
 const inputs=[...document.querySelectorAll('.alloc-input')], allocations=inputs.map(x=>({person:x.dataset.person,amount:Number(x.value)||0})).filter(x=>x.amount>0);
 const allocTotal=allocations.reduce((s,a)=>s+a.amount,0);
 if(!allocations.length){alert('負担額を1人以上入力してください。');return}
 if(Math.abs(allocTotal-amount)>0.0001){alert(`負担額の合計が支払額と一致していません。\\n支払額：${amount} ${currency}\\n負担額合計：${allocTotal} ${currency}`);return}
 state.expenses.push({payer,amount,currency,memo:$('memo').value.trim(),allocations});
 $('amount').value='';$('memo').value='';renderAllocations();save();renderExpenses();renderSummary();
};
window.delExpense=i=>{state.expenses.splice(i,1);save();renderExpenses();renderSummary()};
renderPeople();loadRates();
</script></body></html>
